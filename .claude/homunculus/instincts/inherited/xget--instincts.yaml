# Xget  Workflow Dependency Update Via Dependabot

## Action

Follow the dependency-update-via-dependabot workflow:
1. Dependabot creates a commit updating package.json and/or package-lock.json with new dependency versions.
2. A pull request is opened for the update.
3. The pull request is merged, resulting in a merge commit.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~6x per month
- Files: package.json, package-lock.json

